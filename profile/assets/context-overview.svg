<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">MOCCAVI: context representation and consistency coordination in Vitruvius</title>
<desc id="desc">Conceptual research design. Vitruvius supplies the integration substrate. Inside its virtual single underlying model, artifact models and an explicit context model supply consumer-specific inputs to preservation rules, xDECAF analyses and LLM judgments. MOCCAVI investigates the context representation and coordination of source-specific findings, coverage, conflicts and provenance. This is not a diagram of completed integrations.</desc>
