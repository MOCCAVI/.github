  <path d="M180 374 V416" marker-start="url(#blue-arrow)"/>
  <path d="M180 570 V613" marker-start="url(#blue-arrow)"/>
  <path d="M180 849 V749"/>
 </g>
 <g fill="#526673" font-size="15"><text x="197" y="401">derive views / apply edits</text><text x="197" y="597">changes / propagated updates</text><text x="197" y="798">rule specifications</text></g>
