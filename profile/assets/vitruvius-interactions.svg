 <rect x="32" y="1020" width="1236" height="102" rx="14" fill="#302218"/>
 <text x="56" y="1053" fill="#D9A441" font-size="14" font-weight="700" letter-spacing="1.5">EVALUATION CRITERIA</text>
 <text x="56" y="1087" fill="#F2E8DC" font-size="21">Verdict quality · modelling effort · transfer · functional correctness · human maintainability</text>
 <text x="40" y="1147" fill="#756354" font-size="15">Conceptual design. Dashed links show proposed MOCCAVI interactions, not completed integrations.</text>
