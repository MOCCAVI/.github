<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1160" viewBox="0 0 1300 1160" role="img" aria-labelledby="title desc">
<title id="title">MOCCAVI interacts with the Vitruvius framework</title>
<desc id="desc">Proposed interactions between existing Vitruvius parts and MOCCAVI research. Editors and server APIs expose views for humans and coding agents. The V-SUM contains artifact models and explicit context. Change propagation connects to context-dependent coordination, analyses and judgments. Reactions specifications can be proposed through AI-assisted authoring. Evaluation covers quality, effort, transfer and human maintainability.</desc>
<defs>
 <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#708595"/></marker>
 <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#72815E"/></marker>
</defs>
<rect width="1300" height="1160" rx="20" fill="#F7F3ED"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="40" y="44" fill="#756354" font-size="14" font-weight="700" letter-spacing="2">FRAMEWORK INTEGRATION</text>
 <text x="40" y="89" fill="#302218" font-size="34" font-weight="700">MOCCAVI interfaces with Vitruvius components</text>
 <text x="40" y="125" fill="#655548" font-size="19">Model access, explicit context, coordinated checks and AI assistance.</text>
 <rect x="32" y="158" width="530" height="839" rx="18" fill="#E8EDF0"/>
 <rect x="758" y="158" width="510" height="839" rx="18" fill="#E8EDDF"/>
