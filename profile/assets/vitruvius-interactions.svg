  <rect x="56" y="428" width="482" height="130" rx="10"/>
  <rect x="56" y="625" width="482" height="111" rx="10"/>
  <rect x="56" y="861" width="482" height="105" rx="10"/>
 </g>
 <g fill="#344955" font-size="23" font-weight="700">
  <text x="78" y="291">Views, editors &amp; server access</text>
  <text x="78" y="462">Vitruv core · V-SUM</text>
  <text x="78" y="660">Vitruv-Change</text>
  <text x="78" y="895">Vitruv-DSLs · Reactions</text>
 </g>
 <g fill="#526673" font-size="17">
  <text x="78" y="319">View-based model access</text><text x="78" y="344">Remote access through Vitruv-Server</text>
  <text x="78" y="492">Models, correspondences and view types</text><text x="78" y="520">Derive views; integrate edits</text><text x="78" y="544">MOCCAVI adds context alongside artifact models</text>
  <text x="78" y="690">Represent and propagate model changes</text><text x="78" y="716">Execute consistency-preservation specifications</text>
  <text x="78" y="923">Languages for consistency-preservation rules</text><text x="78" y="948">Reactions supply change-propagation behavior</text>
 </g>
 <!-- Established workflow relationships on the left. -->
