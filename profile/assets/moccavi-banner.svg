<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">MOCCAVI — View-based development with Vitruvius</title>
<desc id="desc">A warm espresso and cream banner with the MOCCAVI coffee-cup logo and three connected context nodes: deployment, purpose and data handling.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6b5546" opacity=".35"/></pattern>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#241710"/><stop offset="1" stop-color="#36261d"/></linearGradient>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<rect x="660" width="540" height="420" rx="22" fill="url(#grid)"/>
<path d="M59 58 H91" stroke="#D9A441" stroke-width="4"/>
<text x="106" y="64" fill="#D9A441" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3">VIEW-BASED SOFTWARE DEVELOPMENT</text>
<text x="56" y="169" fill="#F2E8DC" font-family="Arial,Helvetica,sans-serif" font-size="91" font-weight="700" letter-spacing="-4">MOCCAVI</text>
<text x="62" y="230" fill="#F2E8DC" font-family="Arial,Helvetica,sans-serif" font-size="28">Consistency under explicit context</text>
<text x="62" y="280" fill="#D4C5B8" font-family="Arial,Helvetica,sans-serif" font-size="20">View-based development with Vitruvius</text>
<text x="62" y="309" fill="#D4C5B8" font-family="Arial,Helvetica,sans-serif" font-size="20">Context models · analysis · AI assistance</text>
<circle cx="65" cy="368" r="4" fill="#8FA37E"/>
<text x="80" y="373" fill="#D4C5B8" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1.3">MODELS / CONTEXT / CONSISTENCY</text>
<g fill="none" stroke="#756252" stroke-width="1.5">
 <path d="M909 188 L780 94 H726"/><path d="M942 180 L1066 111 H1105"/><path d="M951 229 L1050 330 H1105"/>
</g>
<g transform="translate(814 106) scale(.43)">
  <!-- MOCCAVI: coffee cup (top view) with a crema consistency-check,
       surrounded by a segmented, swappable context ring.
       Concept: swap the context segment, the verdict in the cup changes. -->
  <defs>
    <radialGradient id="coffee" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#7A4A28"/>
      <stop offset="100%" stop-color="#54321D"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="#241710"/>

  <!-- context ring: three swappable segments (legal / environment / usage) -->
  <g fill="none" stroke-width="26" stroke-linecap="round">
    <path d="M442.4 316.6 A196 196 0 0 1 215.2 447.7" stroke="#D9A441"/>
    <path d="M110.4 387.1 A196 196 0 0 1 110.4 124.9" stroke="#C0674A"/>
    <path d="M215.2 64.3 A196 196 0 0 1 442.4 195.4" stroke="#8FA37E"/>
  </g>

  <!-- cup handle, poking through the ring gap -->
  <circle cx="424" cy="256" r="30" fill="none" stroke="#F2E8DC" stroke-width="20"/>

  <!-- saucer / cup rim -->
  <circle cx="256" cy="256" r="140" fill="#F2E8DC"/>

  <!-- coffee with crema edge -->
  <circle cx="256" cy="256" r="112" fill="url(#coffee)"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#E9BE7F" stroke-width="5"/>

  <!-- crema consistency check -->
  <path d="M204 262 L244 302 L318 214" fill="none" stroke="#EFC98C"
        stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="14">
 <rect x="689" y="58" width="150" height="39" rx="19.5" fill="#403726" stroke="#D9A441"/><text x="764" y="83" fill="#F2E8DC" text-anchor="middle">Deployment</text>
 <rect x="1023" y="76" width="124" height="39" rx="19.5" fill="#303a2c" stroke="#8FA37E"/><text x="1085" y="101" fill="#F2E8DC" text-anchor="middle">Purpose</text>
 <rect x="1010" y="325" width="147" height="39" rx="19.5" fill="#472c22" stroke="#C0674A"/><text x="1083.5" y="350" fill="#F2E8DC" text-anchor="middle">Data handling</text>
</g>
</svg>